<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WWSCES</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="phone">
      <div class="notch"></div>

      <div class="screen">
        <div class="status-bar">
          <span>9:41</span>
          <div class="icons">
            <span>◔</span>
            <span>📶</span>
            <span>🔋</span>
          </div>
        </div>

        <header class="app-header">
          <div class="title-wrap">
            <span class="eyebrow">Good morning</span>
            <h1>WWSCES</h1>
          </div>
          <button class="profile-btn">W</button>
        </header>

        <section class="hero-card">
          <p>오늘의 일정</p>
          <h2>프로젝트 리뷰</h2>
          <button>시작하기</button>
        </section>

        <section class="stats">
          <div class="stat">
            <span>Tasks</span>
            <strong>12</strong>
          </div>
          <div class="stat">
            <span>Focus</span>
            <strong>83%</strong>
          </div>
          <div class="stat">
            <span>Goals</span>
            <strong>4</strong>
          </div>
        </section>

        <section class="list">
          <div class="list-item">
            <div class="dot blue"></div>
            <div>
              <h3>UI 디자인</h3>
              <p>Landing page concept</p>
            </div>
            <span>09:00</span>
          </div>

          <div class="list-item">
            <div class="dot purple"></div>
            <div>
              <h3>코딩</h3>
              <p>Responsive layout</p>
            </div>
            <span>11:30</span>
          </div>

          <div class="list-item">
            <div class="dot green"></div>
            <div>
              <h3>리뷰</h3>
              <p>Prototype check</p>
            </div>
            <span>14:00</span>
          </div>
        </section>
      </div>

      <div class="bottom-nav">
        <span class="active">⌂</span>
        <span>◫</span>
        <span>◎</span>
        <span>☰</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
